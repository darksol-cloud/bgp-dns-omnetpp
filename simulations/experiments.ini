# experiments.ini - Simulation configurations for BGP vs DNS comparison
#
# Execute with: ../out/clang-release/bgp-dns -u Cmdenv -c <ConfigName> -n ../src
# See PLAN.md for experiment descriptions and analysis plan.

[General]
network = bgpdns.FairComparisonNetwork
sim-time-limit = 120s
warmup-period = 2s

# Output configuration
output-scalar-file = ${resultdir}/${configname}-${iterationvarsf}#${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${iterationvarsf}#${repetition}.vec

seed-set = ${repetition}
**.result-recording-modes = default,+histogram

# Default channel parameters
**.EidChannel.delay = 10ms

# ============================================================================
# EXPERIMENT 1: BASELINE OVERHEAD
# Goal: Measure steady-state overhead with no churn
# ============================================================================

[Config Exp1_Baseline_Bgp]
description = "Experiment 1: Baseline overhead measurement - BGP"
repeat = 10

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher at corner
*.node[0].isPublisher = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

# Client at opposite corner
*.node[99].isClient = true
*.node[99].queryCount = 200
*.node[99].queryInterval = 0.3s
*.node[99].queryStartTime = 10s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 10s

[Config Exp1_Baseline_Dns]
description = "Experiment 1: Baseline overhead measurement - DNS (direct mode)"
repeat = 10

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher at corner - also serves as authority for its EIDs
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

# Resolver at center
*.node[50].isResolver = true

# Client at opposite corner
*.node[99].isClient = true
*.node[99].queryCount = 200
*.node[99].queryInterval = 0.3s
*.node[99].queryStartTime = 10s
*.node[99].resolverNodeId = 51

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 10s

# ============================================================================
# EXPERIMENT 2: SCALABILITY - NETWORK SIZE
# Goal: Measure how overhead scales with network size
# Separate configs for each size since OMNeT++ doesn't support conditional params
# ============================================================================

# --- BGP Scalability ---

[Config Exp2_Scale_Bgp_Base]
abstract = true
repeat = 5

*.node[0].isPublisher = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

*.node[*].queryCount = 100
*.node[*].queryInterval = 0.5s
*.node[*].queryStartTime = 15s

*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 10s

[Config Exp2_Scale_Bgp_5x5]
description = "Experiment 2: BGP scalability - 5x5 grid (25 nodes)"
extends = Exp2_Scale_Bgp_Base
*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5
*.node[24].isClient = true

[Config Exp2_Scale_Bgp_10x10]
description = "Experiment 2: BGP scalability - 10x10 grid (100 nodes)"
extends = Exp2_Scale_Bgp_Base
*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10
*.node[99].isClient = true

[Config Exp2_Scale_Bgp_15x15]
description = "Experiment 2: BGP scalability - 15x15 grid (225 nodes)"
extends = Exp2_Scale_Bgp_Base
*.numNodes = 225
*.gridWidth = 15
*.gridHeight = 15
*.node[224].isClient = true

[Config Exp2_Scale_Bgp_20x20]
description = "Experiment 2: BGP scalability - 20x20 grid (400 nodes)"
extends = Exp2_Scale_Bgp_Base
*.numNodes = 400
*.gridWidth = 20
*.gridHeight = 20
*.node[399].isClient = true

# --- DNS Scalability ---

[Config Exp2_Scale_Dns_Base]
abstract = true
repeat = 5

# Publisher is also the authority for its EIDs
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

*.node[*].queryCount = 100
*.node[*].queryInterval = 0.5s
*.node[*].queryStartTime = 10s

*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 10s

[Config Exp2_Scale_Dns_5x5]
description = "Experiment 2: DNS scalability - 5x5 grid (25 nodes)"
extends = Exp2_Scale_Dns_Base
*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5
*.node[12].isResolver = true
*.node[24].isClient = true
*.node[24].resolverNodeId = 12

[Config Exp2_Scale_Dns_10x10]
description = "Experiment 2: DNS scalability - 10x10 grid (100 nodes)"
extends = Exp2_Scale_Dns_Base
*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10
*.node[50].isResolver = true
*.node[99].isClient = true
*.node[99].resolverNodeId = 50

[Config Exp2_Scale_Dns_15x15]
description = "Experiment 2: DNS scalability - 15x15 grid (225 nodes)"
extends = Exp2_Scale_Dns_Base
*.numNodes = 225
*.gridWidth = 15
*.gridHeight = 15
*.node[112].isResolver = true
*.node[224].isClient = true
*.node[224].resolverNodeId = 112

[Config Exp2_Scale_Dns_20x20]
description = "Experiment 2: DNS scalability - 20x20 grid (400 nodes)"
extends = Exp2_Scale_Dns_Base
*.numNodes = 400
*.gridWidth = 20
*.gridHeight = 20
*.node[200].isResolver = true
*.node[399].isClient = true
*.node[399].resolverNodeId = 200

# ============================================================================
# EXPERIMENT 3: SCALABILITY - EID COUNT
# Goal: Measure how overhead scales with number of EIDs
# ============================================================================

[Config Exp3_Eids_Bgp]
description = "Experiment 3: EID count scalability - BGP"
repeat = 5

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with varying EID count
*.node[0].isPublisher = true
*.node[0].publishEids = ${M="1-10","1-50","1-100","1-200","1-500"}
*.node[0].publishStartTime = 3s
*.node[0].publishInterval = 0.01s

# Client
*.node[99].isClient = true
*.node[99].queryCount = 100
*.node[99].queryInterval = 0.5s
*.node[99].queryStartTime = 20s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 10s

[Config Exp3_Eids_Dns]
description = "Experiment 3: EID count scalability - DNS (direct mode)"
repeat = 5

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with varying EID count - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = ${M="1-10","1-50","1-100","1-200","1-500"}
*.node[0].publishStartTime = 3s
*.node[0].publishInterval = 0.01s

# DNS infrastructure - resolver at center
*.node[50].isResolver = true

# Client
*.node[99].isClient = true
*.node[99].queryCount = 100
*.node[99].queryInterval = 0.5s
*.node[99].queryStartTime = 10s
*.node[99].resolverNodeId = 50

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 10s

# ============================================================================
# EXPERIMENT 4: DISCOVERY LATENCY
# Goal: Compare time-to-first-answer
# ============================================================================

[Config Exp4_Latency_Bgp]
description = "Experiment 4: Discovery latency - BGP"
repeat = 10
sim-time-limit = 60s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher at corner
*.node[0].isPublisher = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

# Client at opposite corner - starts querying immediately after publish
*.node[99].isClient = true
*.node[99].queryEids = "1-50"
*.node[99].queryCount = 200
*.node[99].queryInterval = 0.2s
*.node[99].queryStartTime = 2s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 1s
*.groundTruth.convergenceCheckInterval = 0.1s

[Config Exp4_Latency_Dns]
description = "Experiment 4: Discovery latency - DNS (direct mode)"
repeat = 10
sim-time-limit = 60s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher at corner - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-50"
*.node[0].publishStartTime = 3s

# DNS infrastructure - resolver at center
*.node[50].isResolver = true

# Client at opposite corner
*.node[99].isClient = true
*.node[99].queryEids = "1-50"
*.node[99].queryCount = 200
*.node[99].queryInterval = 0.2s
*.node[99].queryStartTime = 5s
*.node[99].resolverNodeId = 50

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 1s

# ============================================================================
# EXPERIMENT 5: CHURN RESILIENCE
# Goal: Compare protocol behavior under EID churn
# ============================================================================

[Config Exp5_Churn_Bgp]
description = "Experiment 5: Churn resilience - BGP"
repeat = 5
sim-time-limit = 180s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with churn
*.node[0].isPublisher = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s
*.node[0].churnInterval = ${churnInt=5,10,20,60}s
*.node[0].churnProbability = 0.3
*.node[0].withdrawProbability = 0.2

# Client
*.node[99].isClient = true
*.node[99].queryEids = "1-20"
*.node[99].queryCount = 300
*.node[99].queryInterval = 0.5s
*.node[99].queryStartTime = 10s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 5s
*.groundTruth.convergenceCheckInterval = 0.5s

[Config Exp5_Churn_Dns]
description = "Experiment 5: Churn resilience - DNS (direct mode)"
repeat = 5
sim-time-limit = 180s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with churn - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s
*.node[0].churnInterval = ${churnInt=5,10,20,60}s
*.node[0].churnProbability = 0.3
*.node[0].withdrawProbability = 0.2

# DNS infrastructure - resolver at center
*.node[50].isResolver = true

# Client
*.node[99].isClient = true
*.node[99].queryEids = "1-20"
*.node[99].queryCount = 300
*.node[99].queryInterval = 0.5s
*.node[99].queryStartTime = 10s
*.node[99].resolverNodeId = 50

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 5s

# ============================================================================
# EXPERIMENT 6: STALENESS UNDER CHURN
# Goal: Measure accuracy of returned information when EIDs change
# ============================================================================

[Config Exp6_Stale_Bgp]
description = "Experiment 6: Staleness under churn - BGP"
repeat = 5
sim-time-limit = 180s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with moderate churn
*.node[0].isPublisher = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s
*.node[0].churnInterval = 10s
*.node[0].churnProbability = 0.3
*.node[0].withdrawProbability = 0.2

# Client
*.node[99].isClient = true
*.node[99].queryEids = "1-20"
*.node[99].queryCount = 500
*.node[99].queryInterval = 0.3s
*.node[99].queryStartTime = 10s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = 5s
*.groundTruth.convergenceCheckInterval = 0.5s
*.groundTruth.recordAccuracySnapshots = true

[Config Exp6_Stale_Dns]
description = "Experiment 6: Staleness under churn - DNS with TTL sweep"
repeat = 5
sim-time-limit = 180s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with moderate churn - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s
*.node[0].churnInterval = 10s
*.node[0].churnProbability = 0.3
*.node[0].withdrawProbability = 0.2

# DNS infrastructure - resolver at center
*.node[50].isResolver = true

# Client
*.node[99].isClient = true
*.node[99].queryEids = "1-20"
*.node[99].queryCount = 500
*.node[99].queryInterval = 0.3s
*.node[99].queryStartTime = 10s
*.node[99].resolverNodeId = 50

# DNS only with direct mode - sweep TTL
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = ${TTL=15,30,60,120}s

*.groundTruth.snapshotInterval = 5s
*.groundTruth.recordAccuracySnapshots = true

# ============================================================================
# EXPERIMENT 7: QUERY PATTERN IMPACT (DNS only)
# Goal: Measure DNS cache effectiveness under different query distributions
# ============================================================================

[Config Exp7_QueryPattern_Dns]
description = "Experiment 7: Query pattern impact on DNS caching"
repeat = 5
sim-time-limit = 120s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with many EIDs - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-100"
*.node[0].publishStartTime = 3s

# DNS infrastructure - resolver at center
*.node[50].isResolver = true

# Client with varying query distribution
*.node[99].isClient = true
*.node[99].queryEids = "1-100"
*.node[99].queryCount = 1000
*.node[99].queryInterval = 0.1s
*.node[99].queryStartTime = 5s
*.node[99].queryZipfAlpha = ${zipf=0,0.5,1.0,1.5,2.0}
*.node[99].resolverNodeId = 50

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 10s

# ============================================================================
# COMBINED COMPARISON (for quick validation)
# ============================================================================

[Config Exp_QuickCompare]
description = "Quick comparison: BGP vs DNS on small network"
repeat = 3
sim-time-limit = 60s

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Publisher - also serves as authority for DNS mode
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-10"
*.node[0].publishStartTime = 3s

# DNS infrastructure (resolver at center)
*.node[12].isResolver = true

# Client
*.node[24].isClient = true
*.node[24].queryEids = "1-10"
*.node[24].queryCount = 50
*.node[24].queryInterval = 0.5s
*.node[24].queryStartTime = 5s
*.node[24].resolverNodeId = 12

# Protocol selection via parameter
*.node[*].bgpEnabled = ${bgp=true,false}
*.node[*].dnsEnabled = ${dns=false,true ! bgp}
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.verboseLogging = true
*.groundTruth.snapshotInterval = 5s
