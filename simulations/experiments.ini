# ============================================================================
# EXPERIMENT 14: LINK INTERMITTENCY (journal extension)
# Goal: Quantify how scheduled contact windows on the trunk link shift the
#       push-vs-pull tradeoff (effective delay d_eff = d + expected waiting).
# Lunar: Earth-Moon trunk with 600s contact period, duty cycle swept.
# Mars: Earth-Mars trunk with 1800s contact period, duty cycle swept.
# Links start "up" at t=0 (phase 0), so initial publication is unaffected;
# churn updates and queries later in the run encounter down windows.
# ============================================================================

[Config Exp14_Lunar_Int_Bgp]
extends = Exp12_Lunar_Bgp
description = "Experiment 14: Lunar network with intermittent Earth-Moon trunk - BGP"

# Earth-Moon trunk contact schedule (both directions of the duplex link)
*.earthDsn.port$o[0].channel.contactPeriod = 600s
*.earthDsn.port$o[0].channel.contactDuty = ${duty=0.25,0.5,0.75}
*.gateway.port$o[0].channel.contactPeriod = 600s
*.gateway.port$o[0].channel.contactDuty = ${duty}

[Config Exp14_Lunar_Int_Dns]
extends = Exp12_Lunar_Dns
description = "Experiment 14: Lunar network with intermittent Earth-Moon trunk - DNS"

# Earth-involved query paths wait for the trunk contact window (store-and-forward).
# rover[1] queries Earth services (EIDs 1-5) directly at the Earth authority:
# path rover-base-gateway-Earth = 1.56s one-way -> 3.12s RTT including the trunk.
*.rover[1].resolverNodeId = -1
*.rover[1].dnsBaseRtt = 3.12s
*.rover[1].dnsTrunkContactPeriod = 600s
*.rover[1].dnsTrunkContactDuty = ${duty=0.25,0.5,0.75}
# Earth DSN queries lunar services at the gateway resolver/authority (1.3s one-way;
# resolver and authority are colocated, so the doubled base RTT equals 2.6s).
*.earthDsn.isClient = true
*.earthDsn.queryEids = "6-15"
*.earthDsn.queryCount = 30
*.earthDsn.queryInterval = 10s
*.earthDsn.queryStartTime = 40s
*.earthDsn.resolverNodeId = 1
*.earthDsn.dnsBaseRtt = 1.3s
*.earthDsn.dnsTrunkContactPeriod = 600s
*.earthDsn.dnsTrunkContactDuty = ${duty}

[Config Exp14_Mars_Int_Bgp]
extends = Exp13_Mars_Bgp
description = "Experiment 14: Mars network with intermittent Earth-Mars trunk - BGP"

*.earthDsn.port$o[0].channel.contactPeriod = 1800s
*.earthDsn.port$o[0].channel.contactDuty = ${duty=0.25,0.5,0.75}
*.marsOrbiter.port$o[0].channel.contactPeriod = 1800s
*.marsOrbiter.port$o[0].channel.contactDuty = ${duty}

[Config Exp14_Mars_Int_Dns]
extends = Exp13_Mars_Dns
description = "Experiment 14: Mars network with intermittent Earth-Mars trunk - DNS"

# Earth-involved queries wait for the trunk contact window (store-and-forward).
# rover[1] (not a publisher) queries Earth services (EIDs 1-3) directly at the
# Earth authority: path rover-habitat-orbiter-Earth = 785s one-way -> 1570s RTT.
*.rover[1].isClient = true
*.rover[1].queryEids = "1-3"
*.rover[1].queryCount = 8
*.rover[1].queryInterval = 300s
*.rover[1].queryStartTime = 100s
*.rover[1].authorityNodeId = 0
*.rover[1].dnsBaseRtt = 1570s
*.rover[1].dnsTrunkContactPeriod = 1800s
*.rover[1].dnsTrunkContactDuty = ${duty=0.25,0.5,0.75}
# Earth DSN queries Mars services at the orbiter resolver/authority (720s one-way;
# resolver and authority are colocated, so the doubled base RTT equals 1440s).
*.earthDsn.isClient = true
*.earthDsn.queryEids = "4-12"
*.earthDsn.queryCount = 8
*.earthDsn.queryInterval = 300s
*.earthDsn.queryStartTime = 150s
*.earthDsn.resolverNodeId = 1
*.earthDsn.dnsBaseRtt = 720s
*.earthDsn.dnsTrunkContactPeriod = 1800s
*.earthDsn.dnsTrunkContactDuty = ${duty}
