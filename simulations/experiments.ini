*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 30s

*.groundTruth.snapshotInterval = ${snapInt=20,40,80 ! delay}s

