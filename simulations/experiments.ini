# ============================================================================
# EXPERIMENT 7: QUERY PATTERN IMPACT (DNS only)
# Goal: Measure DNS cache effectiveness under different query distributions
# ============================================================================

[Config Exp7_QueryPattern_Dns]
description = "Experiment 7: Query pattern impact on DNS caching"
repeat = 5
sim-time-limit = 120s

*.numNodes = 100
*.gridWidth = 10
*.gridHeight = 10

# Publisher with many EIDs - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-100"
*.node[0].publishStartTime = 3s

# DNS infrastructure - resolver at center
*.node[50].isResolver = true
*.node[50].authorityNodeId = 0

# Client with varying query distribution
*.node[99].isClient = true
*.node[99].queryEids = "1-100"
*.node[99].queryCount = 1000
*.node[99].queryInterval = 0.1s
*.node[99].queryStartTime = 5s
*.node[99].queryZipfAlpha = ${zipf=0,0.5,1.0,1.5,2.0}
*.node[99].resolverNodeId = 50
*.node[99].authorityNodeId = 0

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.snapshotInterval = 10s

# ============================================================================
# COMBINED COMPARISON (for quick validation)
# ============================================================================

[Config Exp_QuickCompare]
description = "Quick comparison: BGP vs DNS on small network"
repeat = 3
sim-time-limit = 60s

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Publisher - also serves as authority for DNS mode
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-10"
*.node[0].publishStartTime = 3s

# DNS infrastructure (resolver at center)
*.node[12].isResolver = true
*.node[12].authorityNodeId = 0

# Client
*.node[24].isClient = true
*.node[24].queryEids = "1-10"
*.node[24].queryCount = 50
*.node[24].queryInterval = 0.5s
*.node[24].queryStartTime = 5s
*.node[24].resolverNodeId = 12
*.node[24].authorityNodeId = 0

# Protocol selection via parameter
*.node[*].bgpEnabled = ${bgp=true,false}
*.node[*].dnsEnabled = ${dns=false,true ! bgp}
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 60s

*.groundTruth.verboseLogging = true
*.groundTruth.snapshotInterval = 5s

# ============================================================================
# EXPERIMENT 8: DEEP-SPACE BASELINE LATENCY
# Goal: Compare discovery and lookup latency as link delay increases
# ============================================================================

[Config Exp8_DeepSpace_Bgp]
description = "Experiment 8: Deep-space latency - BGP"
repeat = 3

# Smaller network for faster simulation at high delays
*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Variable link delay (10ms to 20s)
**.channel.delay = ${delay=0.01,0.1,1,5,10,20}s

# Adjust simulation time based on delay (need time for convergence + queries)
# At 20s delay, convergence ~160s, then 50 queries
sim-time-limit = ${simLimit=60,120,300,600,1200,2400 ! delay}s

# Publisher at corner
*.node[0].isPublisher = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s

# Client at opposite corner (8 hops away)
*.node[24].isClient = true
*.node[24].queryEids = "1-20"
*.node[24].queryCount = 50
*.node[24].queryInterval = 1s
# Query start time scales with expected convergence time
*.node[24].queryStartTime = ${queryStart=5,10,50,250,500,1000 ! delay}s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = ${snapInt=5,10,30,60,120,240 ! delay}s

[Config Exp8_DeepSpace_Dns]
description = "Experiment 8: Deep-space latency - DNS (direct mode)"
repeat = 3

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Variable link delay
**.channel.delay = ${delay=0.01,0.1,1,5,10,20}s

# Simulation time
sim-time-limit = ${simLimit=60,120,300,600,1200,2400 ! delay}s

# Publisher at corner - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s

# Resolver at center
*.node[12].isResolver = true
*.node[12].authorityNodeId = 0

# Client at opposite corner
*.node[24].isClient = true
*.node[24].queryEids = "1-20"
*.node[24].queryCount = 50
*.node[24].queryInterval = 1s
*.node[24].queryStartTime = ${queryStart=5,10,50,250,500,1000 ! delay}s
*.node[24].resolverNodeId = 12
*.node[24].authorityNodeId = 0

# DNS only with direct mode
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 300s

*.groundTruth.snapshotInterval = ${snapInt=5,10,30,60,120,240 ! delay}s

# ============================================================================
# EXPERIMENT 9: DEEP-SPACE DNS CACHING IMPACT
# Goal: Measure how DNS caching mitigates the high-latency penalty
# ============================================================================

[Config Exp9_DeepSpace_DnsCache]
description = "Experiment 9: Deep-space DNS with caching"
repeat = 3

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Variable link delay (subset of high-latency scenarios)
**.channel.delay = ${delay=1,5,10,20}s

# Longer simulation for more queries
sim-time-limit = ${simLimit=300,600,1200,2400 ! delay}s

# Publisher at corner - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s

# Resolver at center WITH caching
*.node[12].isResolver = true
*.node[12].authorityNodeId = 0
*.node[12].dnsCacheSize = 100

# Client at opposite corner - Zipf distribution for cache benefit
*.node[24].isClient = true
*.node[24].queryEids = "1-20"
*.node[24].queryCount = 100
*.node[24].queryInterval = 0.5s
*.node[24].queryStartTime = ${queryStart=50,250,500,1000 ! delay}s
*.node[24].queryZipfAlpha = 1.0
*.node[24].resolverNodeId = 12
*.node[24].authorityNodeId = 0

# DNS with caching enabled
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 300s
*.node[*].dnsCacheSize = 100

*.groundTruth.snapshotInterval = ${snapInt=30,60,120,240 ! delay}s

[Config Exp9_DeepSpace_DnsNoCache]
description = "Experiment 9: Deep-space DNS without caching"
repeat = 3

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Variable link delay
**.channel.delay = ${delay=1,5,10,20}s

sim-time-limit = ${simLimit=300,600,1200,2400 ! delay}s

# Publisher at corner - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-20"
*.node[0].publishStartTime = 3s

# Resolver at center - NO caching (TTL=0 effectively disables)
*.node[12].isResolver = true
*.node[12].authorityNodeId = 0
*.node[12].dnsCacheSize = 0

# Client at opposite corner - same Zipf distribution
*.node[24].isClient = true
*.node[24].queryEids = "1-20"
*.node[24].queryCount = 100
*.node[24].queryInterval = 0.5s
*.node[24].queryStartTime = ${queryStart=50,250,500,1000 ! delay}s
*.node[24].queryZipfAlpha = 1.0
*.node[24].resolverNodeId = 12
*.node[24].authorityNodeId = 0

# DNS with caching disabled
*.node[*].bgpEnabled = false
*.node[*].dnsEnabled = true
*.node[*].dnsDirectMode = true
*.node[*].dnsBaseRtt = 0s
*.node[*].dnsTtl = 0s
*.node[*].dnsCacheSize = 0

*.groundTruth.snapshotInterval = ${snapInt=30,60,120,240 ! delay}s

# ============================================================================
# EXPERIMENT 10: DEEP-SPACE CHURN RESILIENCE
# Goal: Compare protocol behavior when EIDs change in high-latency environments
# ============================================================================

[Config Exp10_DeepSpace_Churn_Bgp]
description = "Experiment 10: Deep-space churn - BGP (aggressive params)"
repeat = 3

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Higher delays to push convergence time beyond churn intervals
# Expected convergence: 5s->40s, 10s->80s, 20s->160s
**.channel.delay = ${delay=5,10,20}s

# Simulation time scales with delay (need time for convergence + queries)
sim-time-limit = ${simLimit=800,1200,2400 ! delay}s

# Publisher at corner with aggressive churn
*.node[0].isPublisher = true
*.node[0].publishEids = "1-10"
*.node[0].publishStartTime = 3s
# Shorter churn intervals to ensure convergence > churn at high delays
*.node[0].churnInterval = ${churnInt=20,60,120}s
*.node[0].churnProbability = 0.5
*.node[0].withdrawProbability = 0.3

# Client at opposite corner - more queries to catch stale data
*.node[24].isClient = true
*.node[24].queryEids = "1-10"
*.node[24].queryCount = 100
*.node[24].queryInterval = 3s
# Start queries after initial convergence attempt
*.node[24].queryStartTime = ${queryStart=100,200,400 ! delay}s

# BGP only
*.node[*].bgpEnabled = true
*.node[*].dnsEnabled = false

*.groundTruth.snapshotInterval = ${snapInt=20,40,80 ! delay}s
*.groundTruth.convergenceCheckInterval = 5s

[Config Exp10_DeepSpace_Churn_Dns]
description = "Experiment 10: Deep-space churn - DNS (aggressive params)"
repeat = 3

*.numNodes = 25
*.gridWidth = 5
*.gridHeight = 5

# Higher delays
**.channel.delay = ${delay=5,10,20}s

sim-time-limit = ${simLimit=800,1200,2400 ! delay}s

# Publisher at corner with aggressive churn - also serves as authority
*.node[0].isPublisher = true
*.node[0].isAuthority = true
*.node[0].publishEids = "1-10"
*.node[0].publishStartTime = 3s
*.node[0].churnInterval = ${churnInt=20,60,120}s
*.node[0].churnProbability = 0.5
*.node[0].withdrawProbability = 0.3

# Resolver at center
*.node[12].isResolver = true
*.node[12].authorityNodeId = 0

# Client at opposite corner - more queries
